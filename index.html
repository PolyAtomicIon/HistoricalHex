<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HistoricalHex</title>
    <meta name="description" content="Настольная игра про стройку и торговлю на гексах — каждая партия в своей исторической эпохе" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#070b10" />
    <script>
      // Тема до первой отрисовки — без вспышки тёмного экрана в светлой теме
      try {
        var t = localStorage.getItem('hh.theme') || 'dark';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name=theme-color]').content = '#e9edf1';
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HistoricalHex" />
    <!-- шрифты свои (не Google): не блокируют отрисовку, кириллица и казахские буквы -->
    <link rel="preload" href="./fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <!-- обложка эпохи по умолчанию — главный кадр главной (LCP): качаем сразу, не дожидаясь JS -->
    <link rel="preload" as="image" href="./eras/genghis-md.webp" type="image/webp" fetchpriority="high" />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <style>
        #splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 40%,#123247 0%,#07131d 70%);transition:opacity .45s ease}
        #splash.out{opacity:0;pointer-events:none}
        #splash .sp{display:flex;flex-direction:column;align-items:center;gap:18px}
        #splash svg{width:96px;height:96px;overflow:visible}
        #splash .e{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:60;stroke-dashoffset:60;animation:sp-draw 1.6s cubic-bezier(.6,0,.2,1) infinite}
        #splash .e:nth-child(2){animation-delay:.1s}#splash .e:nth-child(3){animation-delay:.2s}#splash .e:nth-child(4){animation-delay:.3s}#splash .e:nth-child(5){animation-delay:.4s}#splash .e:nth-child(6){animation-delay:.5s}
        #splash .t{font:800 22px/1 Unbounded,Manrope,system-ui,sans-serif;letter-spacing:-.02em;color:#f6f3ec;opacity:.92}
        #splash .s{font:600 13px/1.2 Manrope,system-ui,sans-serif;color:rgba(246,243,236,.55)}
        @keyframes sp-draw{0%{stroke-dashoffset:60;opacity:1}45%,70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-60;opacity:.2}}
        @media (prefers-reduced-motion:reduce){#splash .e{animation:none;stroke-dashoffset:0}}
        html[data-theme=light] #splash{background:radial-gradient(120% 80% at 50% 40%,#f6f8fa 0%,#e9edf1 70%)}
        html[data-theme=light] #splash .t{color:#161b22}
        html[data-theme=light] #splash .s{color:rgba(22,27,34,.6)}
      </style>
      <div class="sp">
        <svg viewBox="-50 -50 100 100">
          <path class="e" stroke="#c8643c" d="M0,-44 L38,-22" />
          <path class="e" stroke="#3f8c4a" d="M38,-22 L38,22" />
          <path class="e" stroke="#9fd06a" d="M38,22 L0,44" />
          <path class="e" stroke="#e8c14d" d="M0,44 L-38,22" />
          <path class="e" stroke="#8d98ad" d="M-38,22 L-38,-22" />
          <path class="e" stroke="#f2b544" d="M-38,-22 L0,-44" />
        </svg>
        <div class="t">HistoricalHex</div>
        <div class="s" id="splash-s">Собираем эпоху…</div>
        <script>
          // подпись заставки — на языке игрока (тот же ключ, что и в приложении)
          try {
            var l = localStorage.getItem('hh.lang') || ((navigator.language || '').toLowerCase().indexOf('kk') === 0 ? 'kz' : 'ru');
            var t = { kz: 'Дәуірді жинап жатырмыз…', en: 'Building the era…' }[l];
            if (t) document.getElementById('splash-s').textContent = t;
          } catch (e) {}
        </script>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main/main.tsx"></script>
  </body>
</html>
