    # HistoricalHex (catan): static client + game WebSocket on historicalhex.service
    location = /catan { return 301 /catan/; }
    location = /catan/ws {
        proxy_pass http://127.0.0.1:8790/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /catan/api/ {
        proxy_pass http://127.0.0.1:8790/api/;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /catan/assets/ { alias /var/www/catan/assets/; add_header Cache-Control "public, max-age=31536000, immutable"; }
    # Свои шрифты: правильный тип woff2 и кэш на год (файлы не меняются)
    location /catan/fonts/ {
        alias /var/www/catan/fonts/;
        types { font/woff2 woff2; text/css css; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
    # Картинки эпох, скрины лендинга, иконки — неделя, потом тихая перепроверка
    location ~ ^/catan/(eras|icons|about/shots)/ {
        root /var/www;
        rewrite ^/catan/(.*)$ /catan/$1 break;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }
    location /catan/ {
        alias /var/www/catan/;
        try_files $uri $uri/ /catan/index.html;
        add_header Cache-Control "no-cache";
    }
